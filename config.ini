; =====================================================================
;  Cyber-Adaptive MLFQ — configuration
;  key = value ; comments start with ';' or '#'. Sections are cosmetic.
;  All times are in ticks (1 tick = 1 simulated microsecond).
; =====================================================================

[scheduler]
quantum               = 2      ; Q0 micro-quantum (also the RR baseline quantum)
mlfq_quantum1         = 4      ; classic MLFQ: quantum of its middle queue
context_switch_cost   = 1      ; ticks lost on every context switch
promotion_aging_ticks = 100    ; K: source must stay calm this long to move up one queue
rehab_ceiling         = 1      ; best queue a once-MALICIOUS source can climb back to
                               ; (1 = never back to Q0, 0 = full rehabilitation)
starvation_aging      = on     ; Q2 anti-starvation boost (on/off)
starvation_limit      = 400    ; ticks in Q2 before a boost to Q1
mlfq_boost_period     = 0      ; classic MLFQ periodic priority boost (0 = off)

[security]
window_ticks          = 50     ; sliding window for request velocity
velocity_cap          = 0.12   ; req/tick treated as max velocity (6 requests per 50 ticks)
frequency_cap         = 20     ; lifetime requests treated as max frequency
w_velocity            = 0.45   ; w1
w_frequency           = 0.20   ; w2
w_anomaly             = 0.35   ; w3
suspicious_threshold  = 0.30   ; score >= this -> Q1 (throttled)
malicious_threshold   = 0.55   ; score >= this -> Q2 (quarantine)

[workload]                      ; used by --generate
horizon                   = 1000  ; legit requests are spread over [0, horizon)
legit_requests_per_trader = 2
legit_burst_min           = 3
legit_burst_max           = 8
legit_anomaly_max         = 0.15
attack_start              = 200
ddos_sources              = 4     ; few IPs, high velocity
ddos_gap_min              = 2
ddos_gap_max              = 6
ddos_burst_min            = 2
ddos_burst_max            = 5
ddos_anomaly_min          = 0.10
ddos_anomaly_max          = 0.40
stuffing_tokens           = 40    ; many tokens, rapid retries, odd payloads
stuffing_spread           = 300
stuffing_gap_min          = 1
stuffing_gap_max          = 3
stuffing_burst_min        = 1
stuffing_burst_max        = 3
stuffing_anomaly_min      = 0.60
stuffing_anomaly_max      = 0.95

[ingestion]
buffer_capacity           = 64    ; bounded producer/consumer buffer

[report]
gantt_max_segments        = 60
table_max_rows            = 25
results_dir               = results
